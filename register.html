<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Libros Prestados</title>
    <link rel="stylesheet" href="stylee.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="libros/logo.png" alt="Logo de la Biblioteca">
            </div>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalog.html">Catálogo</a></li>
                <li><a href="register.html">Registro</a></li>
                <li><a href="history.html">Historial de Préstamos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="form-section">
            <h2>Registro para prestamo de libros</h2>
            <form id="loanForm">
                <div class="form-group">
                    <label for="bookTitle">Título del Libro</label>
                    <input type="text" id="bookTitle" name="bookTitle" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="borrowerName">Nombre del Lector</label>
                    <input type="text" id="borrowerName" name="borrowerName" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="borrowDate">Fecha de Préstamo</label>
                    <input type="date" id="borrowDate" name="borrowDate" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="returnDate">Fecha de Devolución</label>
                    <input type="date" id="returnDate" name="returnDate" required aria-required="true">
                </div>
                
               <center><button type="submit">Registrar Préstamo</button></center> 
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Biblioteca Politecnica. Todos los derechos reservados.</p>
        <p id="datetime"></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
